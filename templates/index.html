<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmacy AI - Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Navbar -->
    <nav class="bg-emerald-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">💊 Farmacy AI Dashboard</h1>
            <span class="text-sm bg-emerald-700 px-3 py-1 rounded-full">System Active</span>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Action / Add Section -->
        <div class="bg-white p-6 rounded-xl shadow-sm mb-8 border border-gray-100">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">Add New Medicine</h2>
            <form id="medForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="name" placeholder="Medicine Name" required class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <input type="text" id="category" placeholder="Category" required class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <input type="number" id="stock" placeholder="Stock Quantity" required class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <input type="number" step="0.01" id="price" placeholder="Price ($)" required class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <button type="submit" class="md:col-span-4 bg-emerald-600 text-white py-2 rounded font-medium hover:bg-emerald-700 transition">Add Medicine</button>
            </form>
        </div>

        <!-- Inventory List Table -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
            <div class="p-6 border-b border-gray-100">
                <h2 class="text-lg font-semibold text-gray-800">Pharmacy Inventory</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm">
                            <th class="p-4">ID</th>
                            <th class="p-4">Medicine Name</th>
                            <th class="p-4">Category</th>
                            <th class="p-4">Stock</th>
                            <th class="p-4">Price</th>
                        </tr>
                    </thead>
                    <tbody id="medTableBody" class="divide-y divide-gray-100 text-sm text-gray-700">
                        {% for med in medicines %}
                        <tr>
                            <td class="p-4">{{ med.id }}</td>
                            <td class="p-4 font-medium text-gray-900">{{ med.name }}</td>
                            <td class="p-4">{{ med.category }}</td>
                            <td class="p-4">{{ med.stock }}</td>
                            <td class="p-4">${{ "%.2f"|format(med.price) }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- JavaScript for Handling Form submission dynamically -->
    <script>
        document.getElementById('medForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const payload = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                stock: document.getElementById('stock').value,
                price: document.getElementById('price').value
            };

            const response = await fetch('/add_medicine', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            if(result.success) {
                location.reload();
            }
        });
    </script>
</body>
  </html>
